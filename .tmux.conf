set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",alacritty:Tc"
set -g status-style 'bg=#333333 fg=#5eacd3'

set -sg escape-time 5
set-option -g focus-events on

# unbind-key C-b
# set -g prefix C-a
# bind-key C-a send-prefix
# 0 is too far from ` ;)
set -g base-index 1
setw -g mode-keys vi
# bind-key -T copy-mode-vi y send-keys -X copy-selection
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'
bind-key -r f run-shell "tmux neww ~/.local/scripts/tmux-sessionizer"
bind-key -r b run-shell "tmux neww ~/.local/scripts/tmux-batman"
bind -r d neww -c "#{pane_current_path}" "[[ -e ToDo.md ]] && nvim ToDo.md || nvim ~/ToDo.md"

#Til at åbne wiki
bind -r w neww -c ~/MyWiki 'nvim .'

#Til at åbne nvim config
bind -r g neww -c ~/.config/nvim 'nvim .'

# bindkey -s ^n "tmux-batman\n"
# bind-key -r k run-shell "~/.local/scripts/tmux-sessionizer ~/Projekter/mailPY"
# bind-key -r k run-shell "tmux new-session -A -s home-session -c ~"

# Reload tmux config
bind r source-file ~/.tmux.conf
